# Cloudflare Pages の設定（予約システム用）。
# 予約・管理・精算の処理が Node.js の部品（データベース接続など）を使うため、nodejs_compat が必要。
# このファイルがあるデプロイでは、ここに書いた項目が Cloudflare の画面より優先される。
# 環境変数はここに書かず、画面で「Secret」として登録する（このリポジトリは公開設定のため）
name = "987sauna"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 本番の設定（秘密の値ではないのでここに書く。秘密の値は Cloudflare の画面で Secret として登録する）
# メール・Discord・シートへの送信を有効にする。プレビューには書かないので、プレビューからは送信されない
[vars]
OUTBOUND_DELIVERY_ENABLED = "true"

# プレビュー環境の公開URL（秘密の値ではないのでここに書く。DATABASE_URL などの秘密の値は画面で Secret として登録する）
[env.preview.vars]
SITE_ORIGIN = "https://reserve-cloudflare.987sauna.pages.dev"
# プレビューからはメール・Discord・シートに送らない（本物のお客様に届かないように）
OUTBOUND_DELIVERY_ENABLED = "false"
